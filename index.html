.tag{font-size:12px;letter-spacing:2px;color:#ddd}

.ico{background:#342238;color:#f02a9b;border-radius:11px;min-width:43px;height:43px;display:flex;align-items:center;justify-content:center;font-size:23px}
.service strong{display:block;font-size:14px;margin-bottom:5px}

.offer{font-size:13px;color:#e5c9dc;text-align:center;margin:25px 0;line-height:1.7}
.qr{text-align:center;background:#252633;padding:16px;border-radius:15px;margin-top:20px}
.qr h2{font-size:15px;margin:0 0 12px}
#qrcode{display:flex;justify-content:center}
#qrcode img{border:9px solid white;border-radius:7px}
small{display:block;color:#aaa;margin-top:12px;font-size:11px}
@media(max-width:480px){.card{margin:10px;padding:16px}}
